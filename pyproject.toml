[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smartplug"
version = "0.1.0"
description = "Desktop monitor and remote control for Tuya / Smart Life smart plugs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "tinytuya>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smartplug = "smartplug.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
